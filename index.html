<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#08080a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="キューシート">
<title>ル・ポン2026 カメラキュー</title>
<style>
:root{
  --bg:#08080a; --panel:#141419; --panel2:#1c1c23; --line:#2b2b35;
  --txt:#eceaf0; --sub:#9b99a8;
  --us:#ff5f52; --bs:#ffb020; --ws:#4da3ff;
  --accent:#ffb020;
  --pad-t:0px; --pad-b:0px;
  --pad-t:constant(safe-area-inset-top); --pad-b:constant(safe-area-inset-bottom);
  --pad-t:env(safe-area-inset-top,0px); --pad-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  -webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
body.dim{filter:brightness(.42) saturate(.85)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

.top{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:rgba(8,8,10,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(var(--pad-t) + 8px) 12px 8px}
.top-row{display:flex;align-items:center;min-height:32px}
.top-row > * + *{margin-left:8px}
.back{font-size:15px;color:var(--accent);padding:4px 8px 4px 0;flex:0 0 auto}
.top-title{font-size:14px;font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{font-size:12px;color:var(--sub);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;flex:0 0 auto;background:var(--panel)}
.iconbtn.on{color:#000;background:var(--accent);border-color:var(--accent);font-weight:700}

.wrap{padding:12px 12px calc(var(--pad-b) + 28px)}
.days{display:-ms-grid;display:grid;grid-template-columns:repeat(4,1fr);
  grid-gap:6px;gap:6px;margin-bottom:14px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 4px;text-align:center}
.day.sel{background:var(--accent);border-color:var(--accent);color:#000}
.day b{display:block;font-size:17px;line-height:1.2}
.day span{font-size:10px;opacity:.75}
.venue{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;margin-bottom:14px;font-size:13px}
.venue .v1{font-weight:700;font-size:14px}
.venue .v2{color:var(--sub);margin-top:3px;font-size:12px;line-height:1.6}
.sect{font-size:11px;letter-spacing:.12em;color:var(--sub);margin:16px 0 8px}
.pc > * + *{margin-left:11px}
.pc{display:flex;align-items:flex-start;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px;margin-bottom:8px}
.pc:active{background:var(--panel2)}
.pc .n{flex:0 0 26px;height:26px;border-radius:7px;background:var(--panel2);
  color:var(--sub);font-size:13px;font-weight:700;display:flex;
  align-items:center;justify-content:center;margin-top:1px}
.pc .b{flex:1;min-width:0}
.pc .cp{font-size:11px;color:var(--accent);font-weight:700}
.pc .ti{font-size:15px;font-weight:700;margin:1px 0 4px;line-height:1.35}
.pc .pl{font-size:11px;color:var(--sub);line-height:1.5}
.pc .du{flex:0 0 auto;font-size:12px;color:var(--sub);
  font-variant-numeric:tabular-nums;margin-top:3px}
.rig{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px;font-size:12.5px;line-height:1.7}
.rig .r{display:flex;padding:7px 0;border-bottom:1px solid var(--line)}
.rig .r > * + *{margin-left:9px}
.rig .r:last-child{border-bottom:none}
.rig .r b{flex:0 0 80px;color:var(--accent);font-size:12px}
.oflag{display:block;width:100%;text-align:left;border-radius:10px;padding:11px 13px;
  margin-bottom:12px;font-size:12.5px;line-height:1.6;border:1px solid var(--line);
  background:var(--panel);color:var(--sub)}
.oflag b{display:block;font-size:13.5px;margin-bottom:2px}
.oflag.ok{border-color:#3ddc84;background:#0e2318}.oflag.ok b{color:#3ddc84}
.oflag.ng{border-color:#ff8a3d;background:#2a1a0c}.oflag.ng b{color:#ff8a3d}
.foot{color:#66646f;font-size:11.5px;line-height:1.75;margin-top:18px}

.cuepage{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.meta{padding:8px 12px 0}
.mvl{margin:8px 12px 0;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:baseline;align-items:baseline}
.mvl > * + *{margin-left:7px}
.mvl b{font-size:20px;font-weight:800;color:var(--accent);line-height:1.2}
.mvl i{font-style:normal;font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-variant-numeric:tabular-nums}
.mvl span{font-size:12px;color:var(--sub);line-height:1.45;margin-left:0;margin-top:3px;
  -webkit-flex:1 0 100%;flex:1 0 100%}
.now .why .src{margin-left:8px;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--sub);white-space:nowrap}
.now .why .src.ok{color:#3ddc84;border-color:#2d6b45}
.now .hd .cz{margin-left:auto;font-size:11px;color:var(--accent);border:1px solid #4a3d18;border-radius:5px;padding:1px 6px}
.mvl.hit{-webkit-animation:mvhit 1.1s ease-in-out 4;animation:mvhit 1.1s ease-in-out 4}
@-webkit-keyframes mvhit{0%,100%{background:var(--panel);border-color:var(--line)}50%{background:#3b2c09;border-color:var(--accent)}}
@keyframes mvhit{0%,100%{background:var(--panel);border-color:var(--line)}50%{background:#3b2c09;border-color:var(--accent)}}
.meta .memo{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.clock{padding:10px 12px 5px;display:flex;align-items:baseline}
.clock > * + *{margin-left:10px}
.clock .big{font-size:46px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1}
.clock .tot{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.clock .st{margin-left:auto;font-size:11px;color:var(--sub);
  border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.clock .st.run{color:#000;background:#3ddc84;border-color:#3ddc84;font-weight:700}
.bar{position:relative;height:5px;background:var(--panel2);margin:0 12px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}

.now{margin:12px;border-radius:14px;border:2px solid var(--line);
  background:var(--panel);padding:15px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.now.us{border-color:var(--us)} .now.us::before{background:var(--us)}
.now.bs{border-color:var(--bs)} .now.bs::before{background:var(--bs)}
.now.ws{border-color:var(--ws)} .now.ws::before{background:var(--ws)}
.now .hd{display:flex;align-items:center;margin-bottom:8px}
.now .hd > * + *{margin-left:8px}
.shot{font-size:12px;font-weight:800;padding:4px 10px;border-radius:7px;color:#000;
  background:var(--line)}
.shot.us{background:var(--us)} .shot.bs{background:var(--bs)} .shot.ws{background:var(--ws)}
.now .at{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.now .who{font-size:29px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.now .inst{font-size:13px;font-weight:700;color:var(--accent);margin-top:4px;line-height:1.3}
.now .nt{font-size:14px;color:#cfccd8;margin-top:8px;line-height:1.55}

.next{margin:0 12px 10px;border-radius:12px;background:var(--panel);
  border:1px dashed var(--line);padding:11px 13px;display:flex;align-items:center}
.next > * + *{margin-left:10px}
.next.soon{border-style:solid;border-color:var(--accent);background:#241d0c}
.next .cd{flex:0 0 auto;font-size:18px;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;min-width:58px}
.next .tx{flex:1;min-width:0;font-size:13px;line-height:1.4}
.next .tx b{font-size:14.5px}
.next .tx span{color:var(--sub);font-size:11.5px;display:block;margin-top:2px}

.ctl{margin-top:auto;position:-webkit-sticky;position:sticky;bottom:0;background:rgba(8,8,10,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:9px 10px calc(var(--pad-b) + 9px)}
.ctl .row{display:flex;margin-bottom:7px}
.ctl .row > * + *{margin-left:7px}
.ctl .row:last-child{margin-bottom:0}
.btn{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:13px 4px;font-size:14px;font-weight:700;text-align:center}
.btn:active{background:#2f2f3a}
.btn.sm{font-size:12.5px;padding:11px 4px;font-weight:600;color:var(--sub)}
.btn.go{background:#3ddc84;border-color:#3ddc84;color:#000;flex:2}
.btn.stop{background:#ff8a3d;border-color:#ff8a3d;color:#000;flex:2}
.btn.key{color:var(--accent);border-color:#4a3d18}

.list{padding:0 12px 12px}
.li > * + *{margin-left:9px}
.li{display:flex;align-items:flex-start;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;margin-bottom:5px;
  background:var(--panel);border:1px solid transparent}
.li.past{opacity:.38}
.li.cur{border-color:var(--accent);background:#211c10}
.li .t{flex:0 0 46px;font-size:12.5px;color:var(--sub);
  font-variant-numeric:tabular-nums;padding-top:2px}
.li .dot{flex:0 0 7px;height:7px;border-radius:50%;margin-top:7px}
.li .c{flex:1;min-width:0}
.li .c b{font-size:14px;font-weight:700}
.li .c i{font-style:normal;font-size:11px;color:var(--sub);display:block;
  line-height:1.45;margin-top:2px}
.up{padding:2px 12px 10px}
.up .h{font-size:10.5px;letter-spacing:.12em;color:var(--sub);margin:4px 0 7px}
.up .r > * + *{margin-left:9px}
.up .r{display:flex;align-items:flex-start;padding:8px 10px;border-radius:9px;
  background:var(--panel);margin-bottom:5px;opacity:.85}
.up .r .t{flex:0 0 42px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.up .r .dot{flex:0 0 7px;height:7px;border-radius:50%;margin-top:6px}
.up .r .c{flex:1;min-width:0}
.up .r .c b{font-size:13.5px}
.up .r .c i{font-style:normal;font-size:11px;color:var(--sub);display:block;line-height:1.4;margin-top:1px}
.mvhdr{font-size:11px;letter-spacing:.1em;color:var(--accent);
  margin:14px 0 7px;padding-left:2px;font-weight:700}
@media (max-width:380px){
  .now .who{font-size:25px}
  .clock .big{font-size:40px}
  .btn{font-size:13px;padding:12px 2px}
  .btn.sm{font-size:11.5px;padding:10px 2px}
  .ctl .row > * + *{margin-left:5px}
  .next .cd{font-size:16px;min-width:50px}
  .pc .ti{font-size:14px}
  .rig .r b{flex:0 0 68px}
}
.face{display:inline-block;width:56px;height:56px;border-radius:50%;background-color:#2a2a33;
  background-size:cover;background-position:center;vertical-align:middle;-webkit-flex:0 0 auto;flex:0 0 auto}
.face.mini{width:22px;height:22px;margin-right:4px;vertical-align:-6px}
.next .tx .nw{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-top:3px}
.next .tx .nw .face.mini{width:28px;height:28px;margin-right:6px}
.next .tx .nn{font-size:14.5px;font-weight:700;min-width:0;line-height:1.3}
.now .ppl{margin-top:2px}
.now .p1{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.now .p1 > * + *{margin-left:12px}
.now .p1 + .p1{margin-top:8px}
.now .p1 .face{width:62px;height:62px;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.now .p1 .pt{-webkit-flex:1;flex:1;min-width:0}
.now .p1 .nm{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.now .p1 .in{font-size:13px;font-weight:700;color:var(--accent);margin-top:3px}
.now .sep{font-size:12px;color:var(--sub);margin:5px 0 5px 20px}
.fstrip{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:8px}
.fstrip .fi{width:74px;text-align:center;margin:0 4px 8px 0}
.fstrip .face{width:48px;height:48px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.fstrip .fn{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.3;word-break:break-all}
.fstrip .fn b{color:var(--fg,#f0eef4);font-size:10.5px;white-space:nowrap}
.lineup{margin:12px 12px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:12px 12px 4px}
.now .why{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:#e9e6f2}
.now .why b{display:inline-block;font-size:11px;font-weight:800;color:#000;background:var(--accent);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.lineup .ab{font-size:12.5px;line-height:1.55;margin:6px 0 10px}
.lineup .ab div + div{margin-top:4px}
.lineup .ab b{display:inline-block;min-width:3.4em;font-size:11px;color:var(--accent)}
.pc .md{font-size:12px;color:#d9d5e4;margin:-2px 0 4px;line-height:1.45}
.lineup .lh{font-size:12px;font-weight:700;color:var(--accent)}
.lineup .lh2{font-size:11.5px;color:var(--sub);line-height:1.5;margin:0 0 8px}
.pc .fs{margin:3px 0 6px;min-height:26px}
.pc .fs .face{width:26px;height:26px;margin-right:-5px;box-shadow:0 0 0 2px var(--panel)}
.roster{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -4px}
.roster .rc{width:25%;padding:6px 4px 10px;text-align:center;box-sizing:border-box}
.roster .face{width:64px;height:64px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.roster .rn{font-size:13px;font-weight:800;margin-top:6px;line-height:1.2}
.roster .ri{font-size:10.5px;color:var(--accent);margin-top:2px}
.roster .rf{font-size:9.5px;color:var(--sub);margin-top:2px;line-height:1.3}
.credit{font-size:9.5px;color:var(--sub);margin:2px 0 4px;text-align:right}
@media (max-width:380px){
  .now .p1 .nm{font-size:23px}
  .now .p1 .face{width:54px;height:54px}
  .roster .rc{width:33.333%}

function vid(){
  if(nsv)return nsv;
  try{
    var v=document.createElement("video");
    v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");
    v.setAttribute("muted","");v.muted=true;v.loop=true;v.defaultMuted=true;
    v.setAttribute("autoplay","");v.autoplay=true;v.setAttribute("preload","auto");
    v.style.cssText="position:fixed;right:0;bottom:0;width:2px;height:2px;pointer-events:none;z-index:1";
    var s1=document.createElement("source");s1.src=NOSLEEP_MP4;s1.type="video/mp4";
    var s2=document.createElement("source");s2.src=NOSLEEP_WEBM;s2.type="video/webm";
    v.appendChild(s1);v.appendChild(s2);
    v.addEventListener("ended",function(){try{v.currentTime=0;v.play();}catch(e){}});
    v.addEventListener("canplay",nsPlay);v.addEventListener("loadeddata",nsPlay);
    v.addEventListener("pause",function(){if(nsWant)setTimeout(nsPlay,200);});
    document.body.appendChild(v);nsv=v;
  }catch(e){}
  return nsv;
}
var nsWant=false;
function nsPlay(){
  if(!nsWant||!nsv)return;
  try{var pr=nsv.play();if(pr&&pr["catch"])pr["catch"](function(){});}catch(e){}
}
function playVid(){
  nsWant=true;
  if(!vid())return;
  nsPlay();setTimeout(nsPlay,300);setTimeout(nsPlay,1200);
}
function lockScreen(){
  playVid();
  if(!wl&&navigator.wakeLock&&navigator.wakeLock.request){
    try{navigator.wakeLock.request("screen").then(function(s){wl=s;
      s.addEventListener("release",function(){wl=null;});})
      .catch(function(){});}catch(e){}
  }
}
function unlockScreen(){
  nsWant=false;
  if(wl){try{wl.release();}catch(e){}wl=null;}
  if(nsv){try{nsv.pause();}catch(e){}}
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&S.running)lockScreen();});

var INSJA={Vn:"バイオリン",Va:"ビオラ",Vc:"チェロ",Cb:"コントラバス",
  Cl:"クラリネット",Hr:"ホルン",Pf:"ピアノ",Org:"オルガン"};
var CIRC={"1":"\u2460","2":"\u2461","3":"\u2462"};
function insJa(a){
  var m=/^([A-Za-z]+)([0-9]?)$/.exec(a); if(!m)return null;
  var b=INSJA[m[1]]; if(!b)return null;
  return b+(m[2]&&CIRC[m[2]]?CIRC[m[2]]:"");
}
function whoParts(s){
  var out=[],toks=s.split(/([\uFF0B\u2192])/);
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    if(t==="\uFF0B"||t==="\u2192"){out.push({sep:t});continue;}
    t=t.replace(/^\s+|\s+$/g,""); if(!t)continue;
    var m=/^(.+?)\(([^)]+)\)$/.exec(t);
    if(m){out.push({name:m[1],inst:insJa(m[2])||m[2]});}
    else{var j=insJa(t);out.push(j?{name:j,inst:null}:{name:t,inst:null});}
  }
  return out;
}
function whoBig(s){var p=whoParts(s),r="",i;
  for(i=0;i<p.length;i++)r+=p[i].sep?" "+p[i].sep+" ":p[i].name;return r;}
function whoSub(s){var p=whoParts(s),r="",any=false,i;
  for(i=0;i<p.length;i++){
    if(p[i].sep){r+=" "+p[i].sep+" ";continue;}
    if(p[i].inst){r+=p[i].inst;any=true;}else{r+="\u30FB";}
  }
  return any?r:"";}
function whoInline(s){var p=whoParts(s),r="",i;
  for(i=0;i<p.length;i++){
    if(p[i].sep){r+=p[i].sep;continue;}
    r+=p[i].name+(p[i].inst?"("+p[i].inst+")":"");
  }
  return r;}
function playersJa(s){
  return s.replace(/\(([A-Za-z]+[0-9]?)\)/g,function(m,a){
    var j=insJa(a);return j?"("+j+")":m;});
}

function face(name,cls){var id=FACEID[name];
  return id?'<span class="face fc-'+id+(cls?" "+cls:"")+'"></span>':"";}
function roster(pc){var a=pc.players.split("\uFF0F"),r=[],i,m;
  for(i=0;i<a.length;i++){m=/^(.+?)\(([^)]+)\)$/.exec(a[i].replace(/^\s+|\s+$/g,""));
    if(m)r.push({name:m[1],ab:m[2],inst:insJa(m[2])||m[2]});}
  return r;}
function targetPeople(pc,s){
  var ro=roster(pc),toks=s.split(/[\uFF0B\u2192]/),out=[],i,j,t,m,base;
  for(i=0;i<toks.length;i++){
    t=toks[i].replace(/^\s+|\s+$/g,"");
    m=/^(.+?)\(([^)]+)\)$/.exec(t);
    if(m){if(FACEID[m[1]])out.push({name:m[1],inst:insJa(m[2])||m[2]});continue;}
    base=GROUPAB[t]||(INSJA[t]?t:null);
    if(base){for(j=0;j<ro.length;j++){if(ro[j].ab.replace(/[0-9]$/,"")===base)out.push({name:ro[j].name,inst:ro[j].inst});}}
  }
  return out;}
function allNamed(s){var t=s.split(/[\uFF0B\u2192]/),i,m;
  for(i=0;i<t.length;i++){m=/^(.+?)\(([^)]+)\)$/.exec(t[i].replace(/^\s+|\s+$/g,""));
    if(!m||!FACEID[m[1]])return false;}
  return true;}

  if(S.done||ci<0)return nowHTML(pc,ci);
  var sc=subCue(pc,ci),k=sc.s==="US"?"us":(sc.s==="BS"?"bs":"ws"),body,p,j;
  if(allNamed(sc.t)){p=whoParts(sc.t);body='<div class="ppl">';
    for(j=0;j<p.length;j++){if(p[j].sep){body+='<div class="sep">\u2193 続けてこちらへ</div>';continue;}
      body+='<div class="p1">'+face(p[j].name)+'<div class="pt"><div class="nm">'+esc(p[j].name)+
        '</div><div class="in">'+esc(p[j].inst||"")+'</div></div></div>';}
    body+='</div>';}
  else body='<div class="who">'+esc(whoBig(sc.t))+'</div>'+stripHTML(targetPeople(pc,sc.t));
  return '<div class="now '+k+'" id="now"><div class="hd"><span class="shot '+k+'">'+shotJa(sc.s)+'</span>'+
    '<span class="at">主カメと別の人</span>'+(micActive()&&S.why?'<span class="cz">'+esc(S.why)+'</span>':"")+'</div>'+body+
    '<div class="nt">'+esc(sc.n||"")+'</div><div class="why"><b>なぜ</b>'+esc(sc.x)+'</div></div>';}
function nextHTML(pc,ci,t){
  if(S.done)return '<div class="next" id="nx"><div class="cd" id="cd">終</div>'+
    '<div class="tx"><b>拍手の間も回し続ける</b><span>次の曲は自動で待ち受けます</span></div></div>';
  if(S.wait&&pc.movs[S.mi+1]){var mv=pc.movs[S.mi+1],fc=null,k,ma=micActive();
    for(k=0;k<pc.cues.length;k++){if(pc.cues[k][0]>=mv[1]){fc=pc.cues[k];break;}}
    return '<div class="next wait" id="nx"><div class="cd" id="cd">待機</div>'+
      '<div class="tx"><b>'+(ma?'楽章の間（音が鳴ると自動で次へ）':'次の楽章の最初の音で［次の楽章］')+'</b>'+
      '<div class="nw">'+(fc?minis(pc,fc[1],3):"")+'<div class="nn">'+esc(mv[0])+'</div></div>'+
      '<span>'+(ma?'ずれた時は［次の楽章］で直せます':'楽章の間はタイマーを自動で止めています')+'</span></div></div>';}
  if(S.hold)return '<div class="next" id="nx"><div class="cd" id="cd">…</div>'+
    '<div class="tx"><b>この楽章がまだ続いています</b><span>終わると自動で次の楽章へ進みます</span></div></div>';
  if(camRole()==="zen")return '<div class="next" id="nx"><div class="cd" id="cd">—</div>'+
    '<div class="tx"><b>固定のまま</b><span>曲が終わるまで動かさない。曲の間に次の人数を確認</span></div></div>';
  var n=pc.cues[ci+1],s2;
  if(n&&camRole()==="sub"){s2=subCue(pc,ci+1);n=[n[0],s2.t,s2.s,s2.n,s2.x];}
  if(!n)return '<div class="next" id="nx"><div class="cd" id="cd">終</div>'+
    '<div class="tx"><b>最後のキューです</b><span>拍手が終わるまで回し続ける</span></div></div>';
  var left=n[0]+(micActive()?S.shift:0)-t,soon=micActive()&&left<=0.6*cueWin(pc,ci+1);
  return '<div class="next'+(left<=10||soon?" soon":"")+'" id="nx">'+
    '<div class="cd" id="cd">'+(soon?"まもなく":(left>=0?"あと"+Math.ceil(left)+"秒":"—"))+'</div>'+
    '<div class="tx"><b>次： '+shotJa(n[2])+'</b><div class="nw">'+minis(pc,n[1],3)+
    '<div class="nn">'+esc(whoInline(n[1]))+'</div></div><span>'+esc(n[3])+'</span></div></div>';
}
function upHTML(pc,ci){
  var h='<div class="up" id="up">',c=0;
  for(var k=ci+2;k<pc.cues.length&&c<3;k++,c++){
    var q=pc.cues[k];
    h+='<div class="r"><div class="t">'+mmss(q[0])+'</div>'+
      '<div class="dot" style="background:var(--'+sc(q[2])+')"></div>'+
      '<div class="c"><b>'+shotJa(q[2])+'　'+minis(pc,q[1],3)+esc(whoInline(q[1]))+'</b><i>'+esc(q[3])+'</i></div></div>';
  }
  if(c===0)return '<div class="up" id="up"></div>';
  return '<div class="up" id="up"><div class="h">この後の流れ</div>'+h.slice(24)+'</div>';
}
function listHTML(pc,ci){
  var h='<div class="list" id="lst">',last="";
  for(var k=0;k<pc.cues.length;k++){
    var mv=movOf(pc,pc.cues[k][0]);
    if(mv!==last){h+='<div class="mvhdr">'+esc(mv)+'</div>';last=mv;}
    h+='<button class="li '+(k===ci?"cur":(k<ci?"past":""))+'" id="li'+k+'" onclick="jump('+k+')">'+
      '<div class="t">'+mmss(pc.cues[k][0])+'</div>'+
      '<div class="dot" style="background:var(--'+sc(pc.cues[k][2])+')"></div>'+
      '<div class="c"><b>'+shotJa(pc.cues[k][2])+'　'+minis(pc,pc.cues[k][1],3)+esc(whoInline(pc.cues[k][1]))+'</b><i>'+esc(pc.cues[k][3])+'</i></div></button>';
  }
  return h+'</div>';
}
function cuepage(){
  var pc=piece(),t=el();cueStep(pc,t);var ci=curCue(pc,t);S.ci=ci;
  var h='<div class="cuepage"><div class="top"><div class="top-row">'+
    '<button class="back" onclick="goHome()">‹ 曲目</button>'+
    (camOn()?'<span class="camchip">'+camLtr(CAM.me)+'</span>':"")+
    '<div class="top-title">'+(S.p+1)+'. '+esc(pc.title)+'</div>'+
    '<button class="iconbtn'+(S.list?" on":"")+'" onclick="toggleList()">一覧</button>'+
    '<button class="iconbtn'+(S.dim?" on":"")+'" onclick="toggleDim()">暗</button></div></div>'+
    mvlHTML(pc,t)+
    (pc.memo?'<div class="meta"><div class="memo">'+esc(pc.memo)+'</div></div>':'')+
    '<div class="clock"><div class="big" id="clk">'+mmss(t)+'</div>'+
    '<div class="tot">/ 約'+mmss(pc.dur)+'</div>'+
    '<div class="st'+stInfo()[0]+'" id="st">'+stInfo()[1]+'</div></div>'+
    barHTML(pc,t)+micHTML()+
    (!S.running&&S.pausedAt===0?lineupHTML(pc):"")+
    (camRole()==="zen"?zenHTML(pc)+nextHTML(pc,ci,t):
      (camRole()==="sub"?subNowHTML(pc,ci)+nextHTML(pc,ci,t):nowHTML(pc,ci)+nextHTML(pc,ci,t))+camOther(pc,ci))+
    (camRole()==="zen"?"":(S.list?listHTML(pc,ci):upHTML(pc,ci)))+
    '<div class="ctl"><div class="row">'+
    '<button class="btn sm" onclick="reset()">0に戻す</button>'+
    '<button class="btn sm" onclick="nudge(-5)">−5秒</button>'+
    '<button class="btn '+(S.running?"stop":"go")+'" id="runb" onclick="toggleRun()">'+
      (S.running?"一時停止":(S.pausedAt>0?"再開":"開始"))+'</button>'+
    '<button class="btn sm" onclick="nudge(5)">＋5秒</button></div><div class="row">'+
    '<button class="btn key" onclick="step(-1)">‹ 前へ</button>'+
    '<button class="btn key" onclick="step(1)">次へ ›</button>'+
    '<button class="'+mvbClass(pc)+'" id="mvb" onclick="nextMov()">次の楽章 ››</button>'+
    '<button class="btn sm" onclick="nextPiece()">次の曲 ›</button>'+
    '</div></div></div>';
  return h;
}

/* ---------- 差分更新 ---------- */
function tick(){
  if(S.view!=="cue")return;
  var pc=piece(),t=el(),g=function(i){return document.getElementById(i);};
  cueStep(pc,t);var ci=curCue(pc,t);
  var clk=g("clk");if(!clk)return;
  clk.textContent=mmss(t);
  g("bar").style.width=Math.min(100,t/pc.dur*100)+"%";
  var st=g("st"),si=stInfo();st.textContent=si[1];st.className="st"+si[0];
  var key=(S.wait?1:0)+(S.hold?2:0)+(S.done?4:0);
  if(key!==S.pk){S.pk=key;var nxe=g("nx");if(nxe)nxe.outerHTML=nextHTML(pc,ci,t);}
  var mb=g("mvb");if(mb)mb.className=mvbClass(pc);
  var rb=g("runb");rb.textContent=S.running?"一時停止":(S.pausedAt>0?"再開":"開始");
  rb.className="btn "+(S.running?"stop":"go");
  var mk=movIdx(pc,t);
  if(mk!==S.pmv){S.pmv=mk;S.flash=Date.now()+4600;S.fl=true;var ml=g("mvl");if(ml)ml.outerHTML=mvlHTML(pc,t);}
  else if(S.fl&&Date.now()>S.flash){S.fl=false;var ml2=g("mvl");if(ml2)ml2.outerHTML=mvlHTML(pc,t);}
  if(ci!==S.ci){
    var old=S.ci;S.ci=ci;
    g("now").outerHTML=camRole()==="zen"?zenHTML(pc):(camRole()==="sub"?subNowHTML(pc,ci):nowHTML(pc,ci));
    g("nx").outerHTML=nextHTML(pc,ci,t);
    var co=g("caml");if(co)co.outerHTML=camOther(pc,ci);
    if(!S.list){var u=g("up");if(u)u.outerHTML=upHTML(pc,ci);}
    if(S.list){
      for(var k=0;k<pc.cues.length;k++){
        var e=g("li"+k);if(!e)continue;
        e.className="li "+(k===ci?"cur":(k<ci?"past":""));
      }
      var cur=g("li"+ci);
      if(cur&&old!==-99){try{cur.scrollIntoView({block:"center",behavior:"smooth"});}
        catch(e){try{cur.scrollIntoView(false);}catch(e2){}}}
    }
  }else{
    var n=pc.cues[ci+1];
    if(n&&!S.wait&&!S.hold&&!S.done){var left=n[0]+(micActive()?S.shift:0)-t,
      soon=micActive()&&left<=0.6*cueWin(pc,ci+1);
      g("cd").textContent=soon?"まもなく":(left>=0?"あと"+Math.ceil(left)+"秒":"—");
      g("nx").className="next"+(left<=10||soon?" soon":"");}
  }
}

/* ---------- 操作 ---------- */
function render(){S.ci=-99;document.getElementById("app").innerHTML=
  (S.view==="home"?home():cuepage());document.body.className=S.dim?"dim":"";
  if(S.view==="home")paintOff();}
function setDay(i){S.d=i;save();render();window.scrollTo(0,0);}
function openPiece(j,auto){if(S.w0)logEv("end",S.mi,el());
  S.p=j;S.view="cue";S.started=null;S.pausedAt=0;S.running=false;S.mi=0;S.wait=false;S.pw=false;S.w0=0;
  S.done=false;S.hold=false;S.pk=-1;S.pmv=0;S.flash=0;S.fl=false;S.cue=0;S.shift=0;S.why="";
  if(MIC.sync){if(auto)MIC.sync.nextPiece(micMovs(piece()),Date.now()/1000,micOpt(piece()));
    else{MIC.sync.setPiece(micMovs(piece()),micOpt(piece()));micSyncFromApp();}}
  if(MIC.want&&!MIC.on&&!MIC.busy)micStart();
  bridge("piece",{day:DATA[S.d].date,piece:S.p,title:piece().title,
    players:roster(piece()).map(function(r){return {name:r.name,inst:r.inst};})});
  render();window.scrollTo(0,0);}
function goHome(){if(S.w0){logEv("end",S.mi,el());S.w0=0;}S.view="home";S.running=false;S.done=false;unlockScreen();render();window.scrollTo(0,0);}
function toggleDim(){S.dim=!S.dim;save();document.body.className=S.dim?"dim":"";
  render();}
function toggleList(){S.list=!S.list;save();render();}
function toggleRun(){
  if(S.running){S.pausedAt=el();S.running=false;unlockScreen();}
  else{if(S.pausedAt===0&&!S.w0)logEv("start",0,0);
    S.started=Date.now()-S.pausedAt*1000;S.running=true;S.done=false;lockScreen();}
  micSyncFromApp();render();}
function reset(){if(!confirm("この曲のタイマーを0に戻しますか？"))return;
  S.started=null;S.pausedAt=0;S.running=false;S.mi=0;S.wait=false;S.w0=0;S.done=false;S.hold=false;
  S.cue=0;S.shift=0;S.why="";unlockScreen();micSyncFromApp();render();}
function setT(t){t=Math.max(0,t);S.pausedAt=t;
  if(S.running)S.started=Date.now()-t*1000;
  S.mi=movIdx(piece(),t);S.wait=false;S.done=false;
  micSyncFromApp();tick();}
function mvbClass(pc){if(pc.movs.length<2||S.mi>=pc.movs.length-1)return "btn mv off";
  return "btn mv"+(S.wait?" on":" ready");}
function nextMov(){var pc=piece(),m=S.mi+1;if(m>=pc.movs.length)return;
  logEv("mov",m,pc.movs[m][1]);
  if(!S.running){S.running=true;lockScreen();}
  setT(pc.movs[m][1]);render();}
function logEv(ev,m,plan,how,atMs,note){try{
  var L=JSON.parse(localStorage.getItem("lepont26log")||"[]"),now=atMs||Date.now(),dt=new Date(now);
  if(ev==="start")S.w0=now;
  var z=function(v){return (v<10?"0":"")+v;};
  L.push({d:DATA[S.d].date,p:S.p,ev:ev,m:m,plan:Math.round(plan*10)/10,
    s:S.w0?Math.round((now-S.w0)/100)/10:0,at:z(dt.getHours())+":"+z(dt.getMinutes())+":"+z(dt.getSeconds()),
    a:how?1:0,n:note||""});
  localStorage.setItem("lepont26log",JSON.stringify(L));}catch(e){}}
function logCount(){try{return JSON.parse(localStorage.getItem("lepont26log")||"[]").length;}catch(e){return 0;}}
function showLog(){var L=[],i,x,N={start:"開始",mov:"次の楽章",step:"次へ/前へ",end:"曲の終わり",redo:"開始やり直し",cue:"指示"};
  try{L=JSON.parse(localStorage.getItem("lepont26log")||"[]");}catch(e){}
  var tx="日付\t曲\t出来事\t番号\t予定秒\t実際秒\t時刻\t操作\tきっかけ\n";
  for(i=0;i<L.length;i++){x=L[i];tx+=x.d+"\t"+(x.p+1)+"\t"+(N[x.ev]||x.ev)+"\t"+(x.ev==="mov"?(x.m+1):"")+
    "\t"+x.plan+"\t"+x.s+"\t"+x.at+"\t"+(x.a?"自動":"手動")+"\t"+(x.n||"")+"\n";}
  var o=document.createElement("div");o.className="logv";o.id="logv";
  o.innerHTML='<b style="color:var(--accent);font-size:15px">実測の記録（'+L.length+'件）</b>'+
    '<div class="lg">終演後に「全部コピー」して送ってください。次の公演の時間合わせに使います。</div>'+
    '<textarea id="logt" readonly></textarea><div class="row">'+
    '<button class="btn key" onclick="copyLog()">全部コピー</button>'+
    '<button class="btn sm" onclick="clearLog()">記録を消す</button>'+
    '<button class="btn" onclick="closeLog()">閉じる</button></div>';
  document.body.appendChild(o);document.getElementById("logt").value=tx;}
function copyLog(){var t=document.getElementById("logt");
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(
    function(){alert("コピーしました");},function(){alert("文字を長押ししてコピーしてください");});return;}}catch(e){}
  t.removeAttribute("readonly");t.focus();t.setSelectionRange(0,t.value.length);
  try{document.execCommand("copy");alert("コピーしました");}catch(e){alert("文字を長押ししてコピーしてください");}
  t.setAttribute("readonly","");}
function clearLog(){if(!confirm("記録を全部消しますか？"))return;
  try{localStorage.removeItem("lepont26log");}catch(e){}closeLog();render();}
function closeLog(){var o=document.getElementById("logv");if(o)o.parentNode.removeChild(o);}
function nudge(s){setT(el()+s);}
function jump(k){S.cue=k;S.shift=0;S.why="";setT(piece().cues[k][0]);}
function step(dir){
  var pc=piece(),c=pc.cues,t=el(),i;
  if(dir>0&&S.wait){nextMov();return;}
  if(micActive()){
    if(dir>0){if(S.cue+1<c.length){fireCue(pc,S.cue+1,t,"man");S.why="手で送った";render();}}
    else{if(S.cue>0){S.cue--;S.why="手で戻した";logEv("cue",S.cue,Math.round(c[S.cue][0]),0,null,"手で戻した");render();}}
    return;}
  if(dir>0){for(i=0;i<c.length;i++){if(c[i][0]>t+0.4){logEv("step",-1,c[i][0]);setT(c[i][0]);return;}}
    setT(piece().dur);}
  else{var pv=0;for(i=0;i<c.length;i++){if(c[i][0]<t-1.5)pv=c[i][0];}logEv("step",-1,pv);setT(pv);}
}
function nextPiece(){if(S.p<DATA[S.d].pieces.length-1)openPiece(S.p+1);else goHome();}

/* ---------- オフライン化（Service Worker） ---------- */
var OFF={state:"checking",msg:""};
function setOff(st,msg){OFF.state=st;OFF.msg=msg;paintOff();}
function paintOff(){
  var e=document.getElementById("oflag");if(!e)return;
  var standalone=(window.navigator.standalone===true)||
    (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);
  if(OFF.state==="ok"){
    e.className="oflag ok";
    e.innerHTML='<b>オフライン準備 完了</b>'+
      (standalone?'ホーム画面アプリとして起動中。電波がなくても動きます。'
                 :'この端末に保存されました。次は 共有 → ホーム画面に追加 でアプリとして使えます。');
  }else if(OFF.state==="ng"){
    e.className="oflag ng";e.innerHTML='<b>オフライン準備 未完了</b>'+OFF.msg;
  }else{
    e.className="oflag";e.innerHTML='<b>オフライン準備を確認中…</b>'+
      'この表示が緑になれば、機内モードでも起動します。';
  }
}
(function(){
  if(location.protocol==="file:"){
    setOff("ng","ファイルから直接開いています。この開き方ではタイマーが動きません。"+
      "Safariでhttpsのアドレスから開いてください。");return;
  }
  if(!("serviceWorker" in navigator)){
    setOff("ng","この端末はオフライン保存に対応していません。iOSを11.3以降に更新するか、"+
      "Safariの リーディングリストに追加 でオフライン保存してください。");return;
  }
  var tries=0;
  function check(){
    if(!window.caches){setOff("ng","キャッシュ機能が無効です。プライベートブラウズを解除してください。");return;}
    tries++;
    caches.match("./index.html").then(function(hit){
      if(hit){setOff("ok","");return;}
      if(tries<25)setTimeout(check,800);
      else setOff("ng","保存が終わりませんでした。電波の良い場所で画面を一度更新してください。");
    }).catch(function(){ if(tries<25)setTimeout(check,1000); });
  }
  check();
  navigator.serviceWorker.register("sw.js").then(function(reg){
    setTimeout(check,400);
  }).catch(function(err){
    setOff("ng","保存に失敗しました（"+(err&&err.name?err.name:"エラー")+"）。"+
      "httpsのアドレスで開いているか確認してください。");
  });
})();

setInterval(tick,400);
render();
</script>
